name: Build StudyGrid APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'studygrid-android-project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract StudyGrid project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q studygrid-android-project.zip -d build-project

      - name: Build debug APK
        working-directory: build-project/studygrid-android
        run: gradle assembleDebug --stacktrace

      - name: Upload StudyGrid APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyGrid-APK
          path: build-project/studygrid-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
